# Lancement :  docker compose -f docker/compose.yml up -d --build
#
# Deux conteneurs seulement :
#   - « site »  : l'application. Elle n'est PAS exposée sur Internet, seul
#                 Caddy peut l'atteindre.
#   - « caddy » : le serveur en façade. Il obtient et renouvelle tout seul le
#                 certificat HTTPS auprès de Let's Encrypt.
#
# Chaque conteneur a un plafond de mémoire et des journaux bornés. Le 16 octobre
# 2026, une vague de requêtes a fait monter Caddy à 3 Go : le serveur entier a
# manqué de mémoire, Docker lui-même s'est enrayé, et le site est resté figé
# trois heures et demie alors que l'attaque avait cessé au bout de dix minutes.
# Avec ces plafonds, un conteneur qui s'emballe est arrêté et relancé en
# quelques secondes, sans entraîner le reste du serveur dans sa chute.

services:
  site:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # Tout l'état du site tient dans ce dossier : base, images et bibliothèque PDF.
      - ../data:/app/data
    # `expose` et non `ports` : le port 3000 reste sur le réseau interne.
    expose:
      - '3000'
    networks:
      - interne
    security_opt:
      - no-new-privileges:true
    # Le site occupe d'habitude 150 Mo ; la marge couvre l'envoi d'un PDF de 50 Mo.
    mem_limit: 1g
    # Trois fichiers de 10 Mo au plus. « non-blocking » : si Docker ne lit pas
    # les journaux assez vite, les lignes en trop sont perdues plutôt que de
    # faire attendre le programme qui les écrit (voir le conteneur caddy).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        mode: non-blocking
        max-buffer-size: 4m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # IPv4 seulement. En IPv6, Docker relaie les visiteurs par docker-proxy,
      # qui remplace leur adresse par la sienne (172.18.0.1) : le site ne
      # pourrait plus les distinguer, ni pour la limite par adresse, ni pour
      # bloquer un spammeur. Le domaine n'a donc pas d'enregistrement AAAA.
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '0.0.0.0:443:443/udp'
    # Caddy lit SITE_DOMAIN et ADMIN_EMAIL depuis le même .env que le site.
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
    networks:
      - interne
    security_opt:
      - no-new-privileges:true
    # Caddy occupe d'habitude 30 Mo. GOMEMLIMIT demande au ramasse-miettes de
    # Go de libérer la mémoire plus activement à l'approche du plafond, pour ne
    # l'atteindre qu'en dernier recours.
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    # Pendant l'attaque du 16 octobre, Caddy écrivait une ligne d'erreur par
    # requête refusée, et Docker, à court de mémoire, ne les lisait plus. Dans
    # le mode par défaut (« blocking »), un programme qui écrit dans un journal
    # plein s'arrête et attend : des lignes écrites à 21 h 29 n'ont été reçues
    # par Docker qu'entre 1 h 01 et 1 h 06, au moment précis où le site est
    # revenu.
    # « non-blocking » sacrifie les lignes en trop pour que Caddy continue de
    # répondre.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        mode: non-blocking
        max-buffer-size: 4m

networks:
  interne:

volumes:
  caddy_data:
  caddy_config:
